# Host Nginx / Baota HTTPS site. Replace the domain and certificate paths.
# Install this on the Docker host, not inside the application gateway.
server {
    listen 80;
    server_name game.example.com;
    return 308 https://game.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name game.example.com;
    ssl_certificate /etc/nginx/certs/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite forwarded headers: never append a client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
