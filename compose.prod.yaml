name: happy-pet-production

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-database-environment: &database-environment
  PGHOST: db
  PGPORT: '5432'
  PGDATABASE: ${PGDATABASE:-happy_pet}
  PGUSER: ${PGUSER:-happy_pet}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod.local}
  PGSSLMODE: disable

services:
  db:
    logging: *logging
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-happy_pet}
      POSTGRES_USER: ${PGUSER:-happy_pet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod.local}
      TZ: Asia/Shanghai
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    networks: [application]
  backend:
    logging: *logging
    image: ${IMAGE_PREFIX:-crpi-ckmtqd558kzqdlu7.cn-hangzhou.personal.cr.aliyuncs.com/failure-plan}/happy-pet-backend:${IMAGE_TAG:-latest}
    environment:
      <<: *database-environment
      API_ADDR: 0.0.0.0:8080
      GIN_MODE: release
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod.local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Set the public HTTPS origin in .env.prod.local}
      COOKIE_SECURE: 'true'
      API_TRUSTED_PROXIES: 172.30.82.2/32
      WECHAT_APP_ID: ${WECHAT_APP_ID:-wx5f84ab7af535815d}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      application:
        ipv4_address: 172.30.82.4
  admin:
    logging: *logging
    image: ${IMAGE_PREFIX:-crpi-ckmtqd558kzqdlu7.cn-hangzhou.personal.cr.aliyuncs.com/failure-plan}/happy-pet-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      application:
        ipv4_address: 172.30.82.5
  gateway:
    logging: *logging
    image: ${IMAGE_PREFIX:-crpi-ckmtqd558kzqdlu7.cn-hangzhou.personal.cr.aliyuncs.com/failure-plan}/happy-pet-gateway:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    depends_on:
      backend: { condition: service_healthy }
      admin: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      application:
        ipv4_address: 172.30.82.2

networks:
  application:
    ipam:
      config:
        - subnet: 172.30.82.0/24
          ip_range: 172.30.82.128/25
          gateway: 172.30.82.1

volumes:
  # Keep the original name so an existing happy-pet-production installation keeps its data.
  postgres:
