worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 # Only the host TLS proxy can declare the original client and HTTPS scheme.
 map "$realip_remote_addr:$http_x_forwarded_proto" $happy_pet_scheme {
  default $scheme;
  "172.30.82.1:https" https;
 }
 server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  client_max_body_size 1m;
  set_real_ip_from 172.30.82.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $happy_pet_scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Cookie $http_cookie;
  proxy_hide_header X-Content-Type-Options;
  add_header X-Content-Type-Options nosniff always;
  location = /healthz { return 200 "ok\n"; }
  location = /api/health { proxy_pass http://backend:8080/health; }
  location ^~ /api/ { proxy_pass http://backend:8080; }
  location = /admin { return 308 /admin/; }
  location ^~ /admin/ { proxy_pass http://admin:8080; }
  location = / { return 308 /admin/; }
  location / { return 404; }
 }
}
