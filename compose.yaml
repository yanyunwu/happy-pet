name: happy-pet
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: happy_pet
      POSTGRES_USER: happy_pet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-happy-pet-local-only}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - happy_pet_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U happy_pet -d happy_pet']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  happy_pet_postgres:
