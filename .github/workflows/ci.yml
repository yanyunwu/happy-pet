name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: API、后台与生产容器
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      GIN_MODE: release
      API_TEST_DATABASE_URL: postgres://happy_pet_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/happy_pet_ci?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: happy_pet_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: happy_pet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U happy_pet_ci -d happy_pet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 准备锁定的 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: 读取 Go 版本
        id: go-version
        run: echo "version=$(make --silent go-version)" >> "$GITHUB_OUTPUT"
      - name: 准备 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: 安装依赖与 sqlc
        run: |
          make install
          make tools
      - name: 格式、代码、类型与 SQL 检查
        run: |
          make format-check
          make lint
          make typecheck-admin
          make sqlc-check
      - name: PostgreSQL 集成与竞态测试
        run: make test-api-race
      - name: 构建 API 与后台
        run: make build-services
      - name: 构建并验证隔离容器
        run: node scripts/test-deployment.mjs
